name: Import OpenSSH 7.6 OpenSSL 1.1 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-openssh-7.6-openssl11.yml'

permissions:
  contents: write

jobs:
  import-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          file='openssh-7.6p1-openssl-1.1.0-1.patch'
          url='https://raw.githubusercontent.com/SliTaz-official/wok-next/da3d8c921703d450ef5818885f9504f3b58ab934/openssh/stuff/patches/openssh-7.6p1-openssl-1.1.0-1.patch'
          curl -fsSL "$url" -o "$file"
          test "$(git hash-object "$file")" = '3b604bdc65a877d83aeb44044562c516789719ee'

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openssh-7.6p1-openssl-1.1.0-1.patch
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add OpenSSH 7.6p1 OpenSSL 1.1 compatibility patch'
          git push
